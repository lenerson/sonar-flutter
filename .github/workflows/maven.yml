name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Optional. When unset, the SonarCloud analysis step is skipped so the
      # build still succeeds on forks and clones without the secret.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # SonarQube Community Build 26.8 requires Java 21, and the plugin targets
      # Java 17 bytecode, so the toolchain must be at least 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: 'maven'

      - name: License Header Check
        run: mvn license:check

      - name: Build
        run: mvn -B package --file pom.xml

      - name: Analyze
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.token=$SONAR_TOKEN \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - name: Read version
        run: echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_ENV

      - name: Upload snapshot release
        if: github.ref == 'refs/heads/develop'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{github.workspace}}/sonar-flutter-plugin/target/*.jar
          tag: ${{env.version}}
          release_name: ${{env.version}}
          overwrite: true
          body: "Snapshot release"
          file_glob: true
          prerelease: true
