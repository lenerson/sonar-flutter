name: Release

on:
  push:
    tags:
      - 0.*

jobs:
  build:

    runs-on: ubuntu-latest

    # Needed to attach the jar to the GitHub release; the repository default
    # for GITHUB_TOKEN is read-only.
    permissions:
      contents: write

    env:
      # Optional. When unset, the SonarCloud analysis step is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Retrieve tag name
        uses: olegtarasov/get-tag@v2.1.4
        id: tag_name

      # SonarQube Community Build 26.8 requires Java 21, and the plugin targets
      # Java 17 bytecode, so the toolchain must be at least 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: 'maven'

      - name: Set version
        run: mvn versions:set -DnewVersion=$GIT_TAG_NAME

      - name: Build
        run: mvn -B package --file pom.xml

      - name: Analyze
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.token=$SONAR_TOKEN \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{github.workspace}}/sonar-flutter-plugin/target/*.jar
          tag: ${{ steps.tag_name.outputs.tag }}
          overwrite: true
          body: ${{steps.build_changelog.outputs.changelog}}
          file_glob: true
